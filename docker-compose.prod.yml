services:
  mariadb:
    image: mariadb:10.4.32
    container_name: chaber_mariadb_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_prod_data:/var/lib/mysql
    networks:
      - chaber_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: chaber_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3000:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - chaber_network
    command: >
      sh -c "
        echo '⏳ Waiting for database...' &&
        sleep 10 &&
        echo '📦 Running Prisma migrations...' &&
        npx prisma migrate deploy &&
        echo '📥 Importing data from SQL...' &&
        mariadb -h mariadb -u root -prootpassword123 --ssl=0 chaber < /app/prisma/dane.sql 2>/dev/null || echo '⚠️ Import done (some data may already exist)' &&
        echo '✅ Data import completed' &&
        echo '🚀 Starting backend...' &&
        npm run dev
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: chaber_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chaber_network

networks:
  chaber_network:
    driver: bridge

volumes:
  mariadb_prod_data:
    name: chaber_mariadb_prod_data