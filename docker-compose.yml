services:
  mariadb:
    image: mariadb:10.4.32
    container_name: chaber_mariadb_dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_dev_data:/var/lib/mysql
    networks:
      - chaber_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chaber_backend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - chaber_network
    command: >
      sh -c "
        echo '⏳ Waiting for database...' &&
        sleep 10 &&
        echo '📦 Running Prisma migrations...' &&
        npx prisma migrate deploy &&
        echo '📥 Importing data from SQL...' &&
        mariadb -h mariadb -u root -prootpassword123 --ssl=0 chaber < /app/prisma/dane.sql 2>/dev/null || echo '⚠️ Import done (some data may already exist)' &&
        echo '✅ Data import completed' &&
        echo '🚀 Starting backend...' &&
        npm run dev
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chaber_frontend_dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chaber_network

  adminer:
    image: adminer:latest
    container_name: chaber_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on:
      - mariadb
    networks:
      - chaber_network

networks:
  chaber_network:
    driver: bridge

volumes:
  mariadb_dev_data:
    name: chaber_mariadb_dev_data